[project]
name = "news-letter"
version = "0.1.0"
description = "YouTube transcript aggregation and newsletter generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.10.3",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
